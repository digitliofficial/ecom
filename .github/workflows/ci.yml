name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: lint-typecheck-test-build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecom
          POSTGRES_PASSWORD: ecom
          POSTGRES_DB: ecom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecom -d ecom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ecom_app:ecom@localhost:5432/ecom
      COMPUTE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Init Postgres schema (RLS + demo seed)
        env:
          PGPASSWORD: ecom
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          for f in infra/docker/postgres/init/*.sql; do
            psql -h localhost -U ecom -d ecom -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: pnpm install --frozen-lockfile
      # @ecom/compute is exercised by the python-compute job (needs uv).
      - run: pnpm exec turbo run lint typecheck test build --filter=!@ecom/compute

  python-compute:
    name: compute-ruff-pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/compute
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check app tests
      - run: uv run pytest

  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    if: false # enable when images + health servers start in CI
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d
      - run: echo "hit /health when api/compute containers are defined"
